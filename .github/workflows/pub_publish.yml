# Publishes flutter_math_fork_fork to pub.dev from a release tag
# (pub-flutter_math_fork_fork-v1.2.3), with telosnex_ci_tools' pub_publish.yml. On pub.dev,
# the package's Admin page allows automated publishing from this repository:
# tag pattern pub-flutter_math_fork_fork-v{{version}}, environment pub.dev.
name: Pub publish

on:
  push:
    tags: ['pub-flutter_math_fork_fork-v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: Telosnex/telosnex_ci_tools/.github/workflows/pub_publish.yml@c356a8d59e643d5fc8c552950fdd45c7e3bfea7f # v0.5.12
    permissions:
      contents: write # the published branch
      id-token: write
    with:
      test: flutter test
